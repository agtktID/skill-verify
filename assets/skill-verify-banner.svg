  <g transform="translate(790 120)"><text x="0" y="-20" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="3">THE LOOP</text><g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700"><rect x="0" y="0" width="150" height="58" rx="12" fill="#172033" stroke="#334155"/><text x="75" y="35" text-anchor="middle" fill="#E2E8F0">CHANGE</text><rect x="180" y="0" width="150" height="58" rx="12" fill="#172033" stroke="#22D3EE"/><text x="255" y="35" text-anchor="middle" fill="#67E8F9">VERIFY</text><rect x="360" y="0" width="150" height="58" rx="12" fill="#172033" stroke="#34D399"/><text x="435" y="35" text-anchor="middle" fill="#6EE7B7">EVIDENCE</text><rect x="540" y="0" width="150" height="58" rx="12" fill="#123126" stroke="#34D399"/><text x="615" y="35" text-anchor="middle" fill="#A7F3D0">PASS</text></g><g stroke="url(#glow)" stroke-width="3" stroke-linecap="round" fill="none"><path d="M155 29H175"/><path d="M335 29H355"/><path d="M515 29H535"/></g><g fill="url(#glow)"><path d="M175 29L166 23V35L175 29Z"/><path d="M355 29L346 23V35L355 29Z"/><path d="M535 29L526 23V35L535 29Z"/></g><text x="345" y="112" text-anchor="middle" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">No fresh proof. No success claim.</text></g>
